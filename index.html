<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GlassCall - Pro Meeting & Cast</title>
  <!-- PeerJS Library for Simple Short ID Connecting -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg1: #090d16;
      --bg2: #1e1b4b;
      --bg3: #311042;
      --tx: #f8fafc;
      --mut: rgba(248, 250, 252, 0.7);
      --gl: rgba(255, 255, 255, 0.08);
      --bd: rgba(255, 255, 255, 0.18);
      --ok: #10b981;
      --bad: #ef4444;
      box-sizing: border-box;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--tx);
      background: linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .glass {
      background: var(--gl);
      border: 1px solid var(--bd);
      border-radius: 24px;
      padding: 18px;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 4px 0;
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h2 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
    .mut { color: var(--mut); font-size: 13px; }

    input {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--bd);
      border-radius: 14px;
      color: var(--tx);
      padding: 12px 14px;
      font: inherit;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
    }

    button {
      border: 1px solid var(--bd);
      background: var(--gl);
      color: var(--tx);
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.1s, background 0.2s;
    }

    button:active { transform: scale(0.96); }
    button:hover { background: rgba(255, 255, 255, 0.15); }

    .pri {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: 0;
      color: #fff;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }

    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .hide { display: none !important; }

    .id {
      font-size: 26px;
      letter-spacing: 3px;
      font-weight: 800;
      color: #f472b6;
      margin-top: 4px;
    }

    #stage {
      position: relative;
      height: 320px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      padding: 4px;
    }

    .video-box {
      position: relative;
      width: 100%;
      height: 100%;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #lv {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 100px;
      height: 140px;
      border-radius: 12px;
      border: 2px solid var(--bd);
      z-index: 5;
    }

    #st {
      position: absolute;
      left: 12px;
      top: 12px;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 99px;
      z-index: 10;
      font-weight: 500;
    }

    .ctl {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ctl button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      padding: 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #msgs {
      height: 100px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      padding-right: 4px;
    }

    .m {
      max-width: 80%;
      padding: 7px 11px;
      border-radius: 12px;
      background: var(--gl);
      font-size: 13px;
      word-break: break-word;
    }

    .m.me { align-self: flex-end; background: rgba(139, 92, 246, 0.6); }

    #modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 20;
      padding: 20px;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--bd);
      backdrop-filter: blur(16px);
      color: #fff;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 13px;
      z-index: 30;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="glass">
      <h1>
        <span>📡 GlassCall Pro</span>
      </h1>
      <div class="mut">Aapka Naam</div>
      <input id="nm" placeholder="Apna naam likhein" maxlength="20" style="margin-top:4px">
      <div class="mut" style="margin-top:10px">Aapki Short Room Key</div>
      <div class="id" id="myid">Connecting...</div>
    </div>

    <!-- Home Screen -->
    <div id="home" class="glass">
      <h2>1-Click Join Room</h2>
      <div class="mut" style="margin-bottom:6px">Dost ki 6-Digit Room Key dalein:</div>
      <input id="targetId" placeholder="Jaise: 839201" type="number">
      <div class="row" style="margin-top:10px">
        <button class="pri" onclick="connectToPeer('voice')">📞 Voice Call</button>
        <button class="pri" onclick="connectToPeer('video')">🎥 Video Call</button>
      </div>
    </div>

    <!-- Active Call Screen -->
    <div id="call" class="hide">
      <div id="stage">
        <div id="st">🟢 Connected</div>
        <div class="video-box"><video id="rv" autoplay playsinline></video></div>
        <video id="lv" autoplay playsinline muted></video>
      </div>
      <div class="glass ctl" style="margin-top:12px">
        <button id="bm" onclick="tAudio()" title="Mic Toggle">🎙️</button>
        <button id="bc" onclick="tCam()" title="Camera Toggle">📷</button>
        <button onclick="tScr()" title="Screen Share">🖥️</button>
        <button style="background:var(--bad)" onclick="endCall()" title="End Call">📵</button>
      </div>
      <div class="glass" style="margin-top:10px">
        <div id="msgs"></div>
        <div class="row">
          <input id="ci" placeholder="Message bhejein...">
          <button style="flex:0 0 65px" class="pri" onclick="send()">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Incoming Call Modal -->
  <div id="modal" class="hide">
    <div class="glass" style="text-align:center;width:100%;max-width:340px">
      <div style="font-size:42px">📞</div>
      <h2 id="who" style="margin-top:8px">Incoming Call</h2>
      <div class="mut">Koi aapko call kar raha hai...</div>
      <div class="row" style="margin-top:16px">
        <button style="background:var(--bad)" onclick="declineCall()">❌ Decline</button>
        <button style="background:var(--ok);color:#fff" onclick="acceptCall()">✅ Answer</button>
      </div>
    </div>
  </div>

  <script>
    const $ = i => document.getElementById(i);
    let peer, activeCall, dataConn;
    let localStream = null;
    let screenTrack = null;
    let incomingCallObj = null;
    let micMuted = false;

    // Generate or fetch 6-Digit ID
    let myShortId = localStorage.getItem('gc_short_id');
    if (!myShortId || myShortId.length !== 6) {
      myShortId = String(Math.floor(100000 + Math.random() * 900000));
      localStorage.setItem('gc_short_id', myShortId);
    }
    $('myid').textContent = myShortId.slice(0, 3) + ' ' + myShortId.slice(3);

    // Initialize PeerJS Connection with custom ID
    function initPeer() {
      peer = new Peer('gc-' + myShortId);

      peer.on('open', (id) => {
        toast('Connected to Server!');
      });

      peer.on('call', (call) => {
        incomingCallObj = call;
        $('modal').classList.remove('hide');
      });

      peer.on('connection', (conn) => {
        dataConn = conn;
        setupDataConn();
      });

      peer.on('error', (err) => {
        toast('Connection Error: ' + err.type);
      });
    }

    initPeer();

    function toast(t) {
      const existing = document.getElementById('toast');
      if (existing) existing.remove();
      const d = document.createElement('div');
      d.id = 'toast';
      d.textContent = t;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 4000);
    }

    function show(v) {
      ['home', 'call'].forEach(x => $(x).classList.toggle('hide', x !== v));
    }

    async function getMedia(type) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: type === 'video' ? { facingMode: 'user' } : false
        });
        localStream = stream;
        $('lv').srcObject = stream;
        return stream;
      } catch (e) {
        toast('Camera/Mic permission deny ho gayi hai.');
        return null;
      }
    }

    async function connectToPeer(type) {
      const target = $('targetId').value.trim();
      if (!target || target.length !== 6) return toast('Sahi 6-Digit Room Key dalein!');

      const stream = await getMedia(type);
      if (!stream) return;

      const remotePeerId = 'gc-' + target;
      dataConn = peer.connect(remotePeerId);
      setupDataConn();

      activeCall = peer.call(remotePeerId, stream);
      setupCall();
      show('call');
    }

    async function acceptCall() {
      $('modal').classList.add('hide');
      if (!incomingCallObj) return;

      const stream = await getMedia('video');
      if (!stream) return;

      activeCall = incomingCallObj;
      activeCall.answer(stream);
      setupCall();
      show('call');
    }

    function declineCall() {
      $('modal').classList.add('hide');
      incomingCallObj = null;
    }

    function setupCall() {
      activeCall.on('stream', (remoteStream) => {
        $('rv').srcObject = remoteStream;
      });
      activeCall.on('close', () => {
        endCall();
      });
    }

    function setupDataConn() {
      dataConn.on('data', (data) => {
        addMsg(data, 0);
      });
    }

    function addMsg(t, isMe) {
      const d = document.createElement('div');
      d.className = 'm' + (isMe ? ' me' : '');
      d.textContent = t;
      $('msgs').appendChild(d);
      $('msgs').scrollTop = 1e9;
    }

    function send() {
      const v = $('ci').value.trim();
      if (!v || !dataConn) return;
      dataConn.send(v);
      addMsg(v, 1);
      $('ci').value = '';
    }

    function tAudio() {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (track) {
        micMuted = !micMuted;
        track.enabled = !micMuted;
        $('bm').textContent = micMuted ? '🔇' : '🎙️';
        toast(micMuted ? 'Mic Muted' : 'Mic On');
      }
    }

    function tCam() {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        $('bc').textContent = track.enabled ? '📷' : '🚫';
      }
    }

    async function tScr() {
      if (!activeCall) return toast('Pehle call connect karein!');
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const screenVideoTrack = stream.getVideoTracks()[0];
        const sender = activeCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
        if (sender) sender.replaceTrack(screenVideoTrack);
        toast('Screen Share Shuru ho gaya hai!');

        screenVideoTrack.onended = () => {
          if (sender && localStream) {
            sender.replaceTrack(localStream.getVideoTracks()[0]);
          }
        };
      } catch (e) {
        toast('Screen share cancel ho gaya.');
      }
    }

    function endCall() {
      if (activeCall) activeCall.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      show('home');
      toast('Call End ho gayi.');
    }

    $('ci').onkeydown = e => { if (e.key === 'Enter') send(); };
  </script>
</body>

</html>
