<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GlassCall Pro - Secure Meetings & Cast</title>
  <!-- PeerJS Library for Simple Short ID Connecting -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg1: #090d16;
      --bg2: #1e1b4b;
      --bg3: #311042;
      --tx: #f8fafc;
      --mut: rgba(248, 250, 252, 0.7);
      --gl: rgba(255, 255, 255, 0.08);
      --bd: rgba(255, 255, 255, 0.18);
      --ok: #10b981;
      --bad: #ef4444;
      box-sizing: border-box;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--tx);
      background: linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .glass {
      background: var(--gl);
      border: 1px solid var(--bd);
      border-radius: 24px;
      padding: 18px;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 4px 0;
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
    .mut { color: var(--mut); font-size: 13px; }

    input {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--bd);
      border-radius: 14px;
      color: var(--tx);
      padding: 12px 14px;
      font: inherit;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
    }

    button {
      border: 1px solid var(--bd);
      background: var(--gl);
      color: var(--tx);
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.1s, background 0.2s;
    }

    button:active { transform: scale(0.96); }
    button:hover { background: rgba(255, 255, 255, 0.15); }

    .pri {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: 0;
      color: #fff;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }

    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .hide { display: none !important; }

    .id {
      font-size: 26px;
      letter-spacing: 3px;
      font-weight: 800;
      color: #f472b6;
      margin-top: 4px;
    }

    #stage {
      position: relative;
      height: 340px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      padding: 4px;
    }

    .video-box {
      position: relative;
      width: 100%;
      height: 100%;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #lv {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 100px;
      height: 140px;
      border-radius: 12px;
      border: 2px solid var(--bd);
      z-index: 5;
      background: #000;
    }

    #st {
      position: absolute;
      left: 12px;
      top: 12px;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 99px;
      z-index: 10;
      font-weight: 500;
    }

    .ctl {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ctl button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      padding: 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #msgs {
      height: 90px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      padding-right: 4px;
    }

    .m {
      max-width: 80%;
      padding: 7px 11px;
      border-radius: 12px;
      background: var(--gl);
      font-size: 13px;
      word-break: break-word;
    }

    .m.me { align-self: flex-end; background: rgba(139, 92, 246, 0.6); }

    #modal, #settingsDrawer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 40;
      padding: 20px;
    }

    #settingsDrawer {
      align-items: flex-end;
      background: rgba(0, 0, 0, 0.4);
    }

    .drawer-content {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--bd);
      border-radius: 28px 28px 0 0;
      padding: 20px;
      width: 100%;
      max-width: 460px;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--bd);
      backdrop-filter: blur(16px);
      color: #fff;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 13px;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="glass">
      <h1>
        <span>📡 GlassCall Pro</span>
        <button style="width:38px;height:38px;padding:0;border-radius:50%;font-size:15px" onclick="toggleSettings()">⚙️</button>
      </h1>
      <div class="mut">Your Room Key / ID</div>
      <div class="id" id="myid">Connecting...</div>
    </div>

    <!-- Home / Call Modes -->
    <div id="home" class="glass">
      <h2>1-to-1 Call</h2>
      <input id="targetId" placeholder="Enter friend's 6-digit key" type="number" style="margin-bottom:8px">
      <div class="row">
        <button class="pri" onclick="connectToPeer('voice')">📞 Voice Call</button>
        <button class="pri" onclick="connectToPeer('video')">🎥 Video Call</button>
      </div>

      <h2 style="margin-top:16px">👥 Multi-User Meeting Room (Upto 5 People)</h2>
      <div class="row">
        <button class="pri" style="background:linear-gradient(135deg,#0ea5e9,#2563eb)" onclick="startMeeting()">🚀 Create / Join Meeting</button>
      </div>
    </div>

    <!-- Active Call Screen -->
    <div id="call" class="hide">
      <div id="stage">
        <div id="st">🟢 Connected</div>
        <div class="video-box"><video id="rv" autoplay playsinline></video></div>
        <video id="lv" autoplay playsinline muted></video>
      </div>
      <div class="glass ctl" style="margin-top:12px">
        <button id="bm" onclick="tAudio()" title="Toggle Mic">🎙️</button>
        <button id="bc" onclick="tCam()" title="Toggle Camera">📷</button>
        <button onclick="tScr()" title="Screen Share / Cast">🖥️</button>
        <button style="background:var(--bad)" onclick="endCall()" title="End Call">📵</button>
      </div>
      <div class="glass" style="margin-top:10px">
        <div id="msgs"></div>
        <div class="row">
          <input id="ci" placeholder="Type a message...">
          <button style="flex:0 0 65px" class="pri" onclick="sendMsg()">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Incoming Call Modal -->
  <div id="modal" class="hide">
    <div class="glass" style="text-align:center;width:100%;max-width:340px">
      <div style="font-size:40px">📞</div>
      <h2 id="who" style="margin-top:8px">Incoming Call</h2>
      <div class="mut">Someone is calling you...</div>
      <div class="row" style="margin-top:16px">
        <button style="background:var(--bad)" onclick="declineCall()">❌ Decline</button>
        <button style="background:var(--ok);color:#fff" onclick="acceptCall()">✅ Answer</button>
      </div>
    </div>
  </div>

  <!-- Settings Drawer -->
  <div id="settingsDrawer" class="hide" onclick="if(event.target === this) toggleSettings()">
    <div class="drawer-content glass">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="margin:0">⚙️ Settings & Permissions</h2>
        <button style="padding:6px 12px;font-size:12px" onclick="toggleSettings()">Close</button>
      </div>
      <div class="mut" style="margin-bottom:12px">Manage hardware permissions and quick diagnostics.</div>
      <button style="width:100%;margin-bottom:8px" onclick="checkPermission('microphone')">🎙️ Check Microphone Permission</button>
      <button style="width:100%;margin-bottom:8px" onclick="checkPermission('camera')">📷 Check Camera Permission</button>
    </div>
  </div>

  <script>
    const $ = i => document.getElementById(i);
    let peer, activeCall, dataConn;
    let localStream = null;
    let incomingCallObj = null;
    let micMuted = false, camOff = false;

    // Generate or fetch 6-Digit ID
    let myShortId = localStorage.getItem('gc_short_id');
    if (!myShortId || myShortId.length !== 6) {
      myShortId = String(Math.floor(100000 + Math.random() * 900000));
      localStorage.setItem('gc_short_id', myShortId);
    }
    $('myid').textContent = myShortId.slice(0, 3) + ' ' + myShortId.slice(3);

    // Initialize PeerJS
    function initPeer() {
      peer = new Peer('gc-' + myShortId);

      peer.on('open', (id) => {
        toast('Connected to Signaling Server');
      });

      peer.on('call', (call) => {
        incomingCallObj = call;
        $('modal').classList.remove('hide');
      });

      peer.on('connection', (conn) => {
        dataConn = conn;
        setupDataConn();
      });

      peer.on('error', (err) => {
        toast('Connection Error: ' + err.type);
      });
    }

    initPeer();

    function toast(t) {
      const existing = document.getElementById('toast');
      if (existing) existing.remove();
      const d = document.createElement('div');
      d.id = 'toast';
      d.textContent = t;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 4000);
    }

    function toggleSettings() {
      $('settingsDrawer').classList.toggle('hide');
    }

    async function checkPermission(type) {
      try {
        const s = await navigator.mediaDevices.getUserMedia(type === 'camera' ? { video: true } : { audio: true });
        s.getTracks().forEach(t => t.stop());
        toast(type.toUpperCase() + ' permission granted successfully!');
      } catch (e) {
        toast(type.toUpperCase() + ' permission denied or unavailable.');
      }
    }

    async function getMedia(type) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true },
          video: type === 'video' ? { facingMode: 'user' } : false
        });
        localStream = stream;
        $('lv').srcObject = stream;
        return stream;
      } catch (e) {
        toast('Camera or Microphone access denied.');
        return null;
      }
    }

    async function connectToPeer(type) {
      const target = $('targetId').value.trim();
      if (!target || target.length !== 6) return toast('Please enter a valid 6-digit Room Key!');

      const stream = await getMedia(type);
      if (!stream) return;

      const remotePeerId = 'gc-' + target;
      dataConn = peer.connect(remotePeerId);
      setupDataConn();

      activeCall = peer.call(remotePeerId, stream);
      setupCall();
      showCallScreen();
    }

    async function startMeeting() {
      const target = prompt('Enter Meeting Room Key to join, or share your own key (' + myShortId + ') with up to 5 participants:');
      if (!target) return;
      $('targetId').value = target.trim();
      connectToPeer('video');
    }

    async function acceptCall() {
      $('modal').classList.add('hide');
      if (!incomingCallObj) return;

      const stream = await getMedia('video');
      if (!stream) return;

      activeCall = incomingCallObj;
      activeCall.answer(stream);
      setupCall();
      showCallScreen();
    }

    function declineCall() {
      $('modal').classList.add('hide');
      incomingCallObj = null;
    }

    function setupCall() {
      activeCall.on('stream', (remoteStream) => {
        const rv = $('rv');
        rv.srcObject = remoteStream;
        rv.play().catch(() => {});
      });
      activeCall.on('close', () => {
        endCall();
      });
    }

    function setupDataConn() {
      dataConn.on('data', (data) => {
        addMsg(data, 0);
      });
    }

    function showCallScreen() {
      ['home', 'modal'].forEach(x => $(x).classList.add('hide'));
      $('call').classList.remove('hide');
    }

    function addMsg(t, isMe) {
      const d = document.createElement('div');
      d.className = 'm' + (isMe ? ' me' : '');
      d.textContent = t;
      $('msgs').appendChild(d);
      $('msgs').scrollTop = 1e9;
    }

    function sendMsg() {
      const v = $('ci').value.trim();
      if (!v || !dataConn) return;
      dataConn.send(v);
      addMsg(v, 1);
      $('ci').value = '';
    }

    function tAudio() {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (track) {
        micMuted = !micMuted;
        track.enabled = !micMuted;
        $('bm').textContent = micMuted ? '🔇' : '🎙️';
        toast(micMuted ? 'Microphone Muted' : 'Microphone Active');
      }
    }

    function tCam() {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      if (track) {
        camOff = !camOff;
        track.enabled = !camOff;
        $('bc').textContent = camOff ? '🚫' : '📷';
        toast(camOff ? 'Camera Paused' : 'Camera Active');
      }
    }

    async function tScr() {
      if (!activeCall) return toast('Please connect to a call first before sharing screen.');
      if (!navigator.mediaDevices.getDisplayMedia) return toast('Screen sharing is not supported on this browser.');
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const screenTrack = stream.getVideoTracks()[0];
        const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) sender.replaceTrack(screenTrack);
        toast('Screen Sharing Started 🖥️');

        screenTrack.onended = () => {
          if (sender && localStream) {
            sender.replaceTrack(localStream.getVideoTracks()[0]);
          }
          toast('Screen Sharing Stopped');
        };
      } catch (e) {
        toast('Screen sharing cancelled.');
      }
    }

    function endCall() {
      if (activeCall) activeCall.close();
      if (dataConn) dataConn.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      $('call').classList.add('hide');
      $('home').classList.remove('hide');
      $('msgs').innerHTML = '';
      toast('Call Ended.');
    }

    $('ci').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };
  </script>
</body>

</html>
